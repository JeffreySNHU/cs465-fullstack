<div class="container mt-4">
  <div class="row">
    <div class="col-12 col-md-8">
      <h2>Login</h2>
      <p class="lead">Sign in to manage your Travlr Getaways.</p>
      
      <div *ngIf="formError" class="alert alert-danger" role="alert">
        {{ formError }}
      </div>

      <form (ngSubmit)="onLoginSubmit()">
        <div class="form-group mt-3">
          <label for="email">Email address</label>
          <input type="email" class="form-control" id="email" name="email" [(ngModel)]="credentials.email" placeholder="Enter email">
        </div>
        <div class="form-group mt-3">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" [(ngModel)]="credentials.password" placeholder="Password">
        </div>
        <button type="submit" class="btn btn-primary mt-4">Sign in</button>
      </form>

    </div>
  </div>
</div>
